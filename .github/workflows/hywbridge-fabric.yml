name: build-hywbridge-fabric
run-name: Building HYW Bridge (Fabric 1.21.1)

on:
  push:
    paths:
      - 'hywbridge-fabric/**'
      - '.github/workflows/hywbridge-fabric.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hywbridge-fabric
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'

      - name: build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: hywbridge-fabric-1.21.1
          path: hywbridge-fabric/build/libs/

      - name: server smoke test (all mods loaded, every mixin applied)
        run: |
          mkdir -p run && echo 'eula=true' > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > run/server.properties
          timeout 600 ./gradlew runServer --args='nogui' -Dorg.gradle.jvmargs=-Xmx3G \
            -Phywbridge_audit=true 2>&1 | tee run/smoke.log || true
          grep -q 'HYWBRIDGE_AUDIT_OK' run/smoke.log || { echo 'Smoke test failed'; grep -iE 'mixin|error|exception' run/smoke.log | head -80; exit 1; }
